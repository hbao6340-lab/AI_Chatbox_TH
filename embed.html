<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trợ lý ảo UBND Phường Tân Hưng - Embed</title>
    <style>
        /* Chatbot Widget Styles - Blue Theme */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        #chat-widget-toggle {
            position: fixed; bottom: 24px; right: 24px;
            width: 60px; height: 60px;
            border: none; border-radius: 50%;
            background: linear-gradient(135deg, #006FB9 0%, #0088cc 100%);
            color: white; font-size: 24px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 111, 185, 0.4);
            transition: all 0.3s ease; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
        }
        #chat-widget-toggle:hover { transform: scale(1.1); box-shadow: 0 6px 20px rgba(0, 111, 185, 0.6); }
        #chat-widget-toggle.open .toggle-icon { display: none; }
        #chat-widget-toggle.open .toggle-close { display: block; }
        #chat-widget-toggle:not(.open) .toggle-close { display: none; }
        
        #chat-widget-container {
            position: fixed; bottom: 100px; right: 24px;
            width: 380px; height: 520px;
            max-width: calc(100vw - 48px); max-height: calc(100vh - 160px);
            background: #fff; border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            display: flex; flex-direction: column; overflow: hidden;
            z-index: 9998;
            transform: scale(0); transform-origin: bottom right;
            opacity: 0; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }
        #chat-widget-container.open { transform: scale(1); opacity: 1; pointer-events: all; }
        
        .chat-widget-header {
            background: linear-gradient(135deg, #006FB9 0%, #0088cc 100%);
            color: white; padding: 16px 20px;
            display: flex; align-items: center; justify-content: space-between;
            flex-shrink: 0;
        }
        .header-info { display: flex; align-items: center; gap: 12px; }
        .header-avatar {
            width: 40px; height: 40px;
            background: rgba(255,255,255,0.2); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; flex-shrink: 0;
        }
        .header-avatar img {
            width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
        }
        .header-text { display: flex; flex-direction: column; }
        .header-title { font-size: 16px; font-weight: 600; margin: 0; }
        .header-subtitle { font-size: 12px; opacity: 0.85; margin: 2px 0 0 0; }
        .chat-widget-close {
            background: rgba(255,255,255,0.2); border: none; color: white;
            width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
            font-size: 16px; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .chat-widget-close:hover { background: rgba(255,255,255,0.3); }
        
        .chat-messages {
            flex: 1; overflow-y: auto; padding: 16px;
            background: #f8f9fa; display: flex; flex-direction: column; gap: 12px;
        }
        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
        .chat-messages::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
        
        .welcome-message { display: flex; gap: 10px; animation: fadeInUp 0.5s ease; }
        .welcome-avatar {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, #006FB9, #0088cc);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            overflow: hidden; flex-shrink: 0;
        }
        .welcome-avatar img {
            width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
        }
        .welcome-bubble {
            background: white; padding: 12px 16px; border-radius: 16px;
            border-top-left-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            max-width: 85%;
        }
        .welcome-bubble p { color: #333; font-size: 14px; line-height: 1.6; margin: 0; }
        .message-time { font-size: 11px; color: #999; margin-top: 4px; display: block; }
        
        .message { display: flex; gap: 10px; animation: fadeInUp 0.3s ease; }
        .message.user { flex-direction: row-reverse; }
        .message-avatar {
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; flex-shrink: 0;
        }
        .message-avatar img {
            width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
        }
        .message.ai .message-avatar { background: linear-gradient(135deg, #006FB9, #0088cc); }
        .message.user .message-avatar { background: linear-gradient(135deg, #006FB9, #0088cc); color: white; font-weight: bold; font-size: 14px; }
        .message-bubble {
            padding: 10px 14px; border-radius: 16px; max-width: 75%;
            word-wrap: break-word; line-height: 1.5; font-size: 14px;
        }
        .message.ai .message-bubble {
            background: white; color: #333; border-top-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .message.user .message-bubble {
            background: linear-gradient(135deg, #006FB9, #0088cc); color: white;
            border-top-right-radius: 4px;
        }
        
        .typing-indicator { display: flex; gap: 4px; padding: 8px 0; }
        .typing-indicator span {
            width: 8px; height: 8px; background: #bbb; border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-4px); }
        }
        
        .chat-input-area {
            display: flex; align-items: center; gap: 8px;
            padding: 12px 16px; background: white;
            border-top: 1px solid #eee; flex-shrink: 0;
        }
        .chat-input {
            flex: 1; padding: 10px 16px; font-size: 14px;
            border: 1px solid #e0e0e0; border-radius: 24px; outline: none;
            transition: all 0.2s;
        }
        .chat-input:focus { border-color: #006FB9; box-shadow: 0 0 0 3px rgba(0, 111, 185, 0.1); }
        .chat-input::placeholder { color: #aaa; }
        .send-btn {
            width: 40px; height: 40px; border: none; border-radius: 50%;
            background: linear-gradient(135deg, #006FB9 0%, #0088cc 100%);
            color: white; cursor: pointer; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .send-btn:hover { transform: scale(1.1); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .message.error .message-bubble {
            background: #fff3f3; color: #d32f2f;
            border: 1px solid #ffcdd2;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @media (max-width: 480px) {
            #chat-widget-container {
                width: 100%; height: 100%;
                max-width: none; max-height: none;
                bottom: 0; right: 0; border-radius: 0;
            }
            #chat-widget-toggle { bottom: 16px; right: 16px; }
        }
        @media (prefers-reduced-motion: reduce) {
            #chat-widget-container, #chat-widget-toggle, .message, .welcome-message {
                animation: none; transition: none;
            }
        }
    </style>
</head>
<body>
    <!-- Chatbot Widget HTML Structure -->
    <button id="chat-widget-toggle" class="chat-widget-toggle" aria-label="Mở trợ lý ảo">
        <span class="toggle-icon">💬</span>
        <span class="toggle-close">✕</span>
    </button>

    <div id="chat-widget-container" class="chat-widget-container">
        <div class="chat-widget-header">
            <div class="header-info">
                <div class="header-avatar"><img src="avatar.png" alt="Avatar"></div>
                <div class="header-text">
                    <h3 class="header-title">Trợ lý ảo UBND Phường Tân Hưng</h3>
                    <p class="header-subtitle">Hỗ trợ Phường Tân Hưng</p>
                </div>
            </div>
            <button id="chat-widget-close" class="chat-widget-close" aria-label="Đóng">✕</button>
        </div>

        <div id="chat-messages" class="chat-messages">
            <div class="welcome-message">
                <div class="welcome-avatar"><img src="avatar.png" alt="Avatar"></div>
                <div class="welcome-bubble">
                    <p>Chào quý cô chú, anh chị và các bạn đến với Trợ lý ảo Phường Tân Hưng. Tôi rất vui khi được hỗ trợ! Hãy nói tôi biết cô, chú, anh, chị muốn biết gì về phường Tân Hưng.</p>
                    <span class="message-time">Vừa xong</span>
                </div>
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="chat-input" class="chat-input" placeholder="Nhập tin nhắn..." autocomplete="off">
            <button id="send-btn" class="send-btn" aria-label="Gửi">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <script>window.CHATBOT_API_BASE = 'https://ai-supporter-vn-backend.vercel.app'; window.CHATBOT_API_PATH = '/api';</script>
    <script src="widget.js"></script>
</body>
</html>
